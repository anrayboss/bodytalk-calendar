<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>身體對話 活動月曆</title>
  <meta name="description" content="身體對話生活覺識場 團隊活動月曆，空間使用排程與活動認領共管平台。">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    const saved = localStorage.getItem('bt-theme');
    if (saved === 'light') document.documentElement.classList.remove('dark');
    else document.documentElement.classList.add('dark');
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>

<body
  class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 h-screen flex flex-col font-sans overflow-hidden"
  style="font-family:'Noto Sans TC',sans-serif;">

  <!-- HEADER -->
  <header
    class="bg-white/80 dark:bg-slate-900/90 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 px-4 py-2.5 flex items-center justify-between shadow-sm shrink-0 z-40">
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <div class="bg-gradient-to-br from-teal-500 to-emerald-600 p-2 rounded-xl shadow-md">
        <i class="fa-solid fa-seedling text-white text-lg"></i>
      </div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-slate-900 dark:text-white tracking-wide">身體對話 活動月曆</h1>
        <p class="text-[14px] text-slate-400 hidden md:block">生活覺識場空間共管平台</p>
      </div>
    </div>

    <!-- Desktop Toolbar -->
    <div class="hidden md:flex items-center gap-2">
      <!-- Search -->
      <div class="relative">
        <i
          class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
        <input id="search-input" type="text" placeholder="搜尋活動..." oninput="handleSearch(this.value)"
          class="pl-7 pr-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500/50 w-40">
      </div>

      <div class="h-5 w-px bg-slate-200 dark:bg-slate-700"></div>

      <!-- Undo / Redo -->
      <button id="btn-undo" onclick="undoAction()" disabled title="復原 Ctrl+Z"
        class="toolbar-btn disabled:opacity-40 disabled:cursor-not-allowed">
        <i class="fa-solid fa-rotate-left"></i><span class="text-xs">復原</span>
      </button>
      <button id="btn-redo" onclick="redoAction()" disabled title="重做 Ctrl+Y"
        class="toolbar-btn disabled:opacity-40 disabled:cursor-not-allowed">
        <i class="fa-solid fa-rotate-right"></i><span class="text-xs">重做</span>
      </button>

      <div class="h-5 w-px bg-slate-200 dark:bg-slate-700"></div>

      <!-- View toggle (right panel only) -->
      <div class="bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg flex gap-0.5">
        <button id="btn-view-month" onclick="setCalView('month')" class="view-btn active-view" title="月曆">
          <span>📅</span><span>月</span>
        </button>
        <button id="btn-view-week" onclick="setCalView('week')" class="view-btn" title="週曆">
          <span>🗓️</span><span>週</span>
        </button>
        <button id="btn-view-day" onclick="setCalView('day')" class="view-btn" title="日曆">
          <span>📆</span><span>日</span>
        </button>
      </div>

      <div class="h-5 w-px bg-slate-200 dark:bg-slate-700"></div>

      <!-- Share -->
      <button onclick="shareApp()" title="分享" class="toolbar-btn">
        <i class="fa-solid fa-share-nodes"></i><span class="text-xs">分享</span>
      </button>

      <!-- Dark mode -->
      <button onclick="toggleTheme()" title="切換深淺色" class="toolbar-btn w-9 justify-center">
        <i class="fa-solid fa-sun hidden dark:inline-block text-amber-400"></i>
        <i class="fa-solid fa-moon dark:hidden text-slate-600"></i>
      </button>

      <div class="h-5 w-px bg-slate-200 dark:bg-slate-700"></div>

      <!-- Guest Admin toggle (demo mode) -->
      <button id="btn-guest-admin" onclick="toggleGuestAdmin()" title="切換訪客編輯模式（不需登入）"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border text-xs font-medium transition
               border-amber-400/40 text-amber-600 dark:text-amber-400 bg-amber-500/10 hover:bg-amber-500/20">
        🔒 訪客模式
      </button>

      <!-- Auth -->
      <button id="btn-auth" onclick="openAuthModal()"
        class="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-lg bg-teal-500/10 dark:bg-teal-500/20 border border-teal-500/30 text-teal-700 dark:text-teal-300 text-xs font-medium hover:bg-teal-500/20 transition">
        <i class="fa-solid fa-user-circle text-sm"></i>
        <span id="auth-label">設定登入</span>
      </button>

      <!-- Add event (admin only) -->
      <button id="btn-add-event" onclick="openEventForm()" style="display:none"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-teal-500 to-emerald-500 text-white text-xs font-medium shadow-md hover:shadow-lg hover:opacity-90 transition">
        <i class="fa-solid fa-plus"></i><span>新增活動</span>
      </button>
    </div>

    <!-- Mobile menu button -->
    <div class="md:hidden flex items-center gap-2">
      <button id="btn-guest-admin-mob" onclick="toggleGuestAdmin()" title="訪客編輯模式"
        class="text-xs px-2 py-1.5 rounded-lg border border-amber-400/40 text-amber-500 bg-amber-500/10 font-medium transition">
        🔒
      </button>
      <button onclick="shareApp()" class="toolbar-btn"><i class="fa-solid fa-share-nodes"></i></button>
      <button onclick="openAuthModal()" class="toolbar-btn"><i class="fa-solid fa-user-circle"></i></button>
      <button onclick="toggleMobileMenu()" class="toolbar-btn"><i class="fa-solid fa-bars text-lg"></i></button>
    </div>
  </header>

  <!-- Mobile menu drawer -->
  <div id="mobile-menu"
    class="hidden md:hidden bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex flex-wrap gap-2 shrink-0 z-30">
    <div class="relative w-full">
      <i
        class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
      <input type="text" placeholder="搜尋活動..." oninput="handleSearch(this.value)"
        class="w-full pl-7 pr-3 py-2 text-sm bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none">
    </div>
    <div class="bg-slate-100 dark:bg-slate-800 p-0.5 rounded-lg flex gap-0.5">
      <button onclick="setCalView('month');toggleMobileMenu()" class="view-btn active-view"><span>📅</span><span>月</span></button>
      <button onclick="setCalView('week');toggleMobileMenu()" class="view-btn"><span>🗓️</span><span>週</span></button>
      <button onclick="setCalView('day');toggleMobileMenu()" class="view-btn"><span>📆</span><span>日</span></button>
    </div>
    <button onclick="toggleTheme()" class="toolbar-btn"><i class="fa-solid fa-circle-half-stroke"></i><span
        class="text-xs">主題</span></button>
    <!-- Undo / Redo -->
    <button id="btn-undo-mob" onclick="undoAction()" disabled title="復原"
      class="toolbar-btn disabled:opacity-40 disabled:cursor-not-allowed">
      <i class="fa-solid fa-rotate-left"></i><span class="text-xs">復原</span>
    </button>
    <button id="btn-redo-mob" onclick="redoAction()" disabled title="重做"
      class="toolbar-btn disabled:opacity-40 disabled:cursor-not-allowed">
      <i class="fa-solid fa-rotate-right"></i><span class="text-xs">重做</span>
    </button>
    <!-- Guest Admin -->
    <button onclick="toggleGuestAdmin();toggleMobileMenu()"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-amber-400/40 text-amber-600 dark:text-amber-400 bg-amber-500/10 text-xs font-medium transition hover:bg-amber-500/20">
      🔒 訪客編輯模式
    </button>
    <button id="btn-add-event-mobile" onclick="openEventForm()" style="display:none"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-teal-500 to-emerald-500 text-white text-xs font-medium">
      <i class="fa-solid fa-plus"></i><span>新增活動</span>
    </button>
  </div>

  <!-- MAIN LAYOUT -->
  <main class="flex-1 flex overflow-hidden">

    <!-- LEFT: Pure text list -->
    <aside id="text-panel"
      class="w-64 lg:w-72 shrink-0 flex flex-col bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 overflow-hidden transition-[width,margin] duration-200">
      <div
        class="px-4 py-2.5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between shrink-0">
        <span class="text-xs font-semibold text-teal-600 dark:text-teal-400 flex items-center gap-1.5">
          <i class="fa-solid fa-list-ul"></i> 活動清單
        </span>
        <div class="flex items-center gap-1">
          <button type="button" onclick="copyTextList()" title="複製全文" class="text-xs text-slate-400 hover:text-teal-500 transition p-1 cursor-pointer">
            <i class="fa-regular fa-copy"></i>
          </button>
          <button type="button" id="btn-collapse-text-panel" onclick="toggleTextPanel()" title="收合清單" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition p-1 cursor-pointer">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
        </div>
      </div>
      <div id="text-list"
        class="flex-1 overflow-y-auto px-4 py-3 text-xs leading-relaxed text-slate-600 dark:text-slate-300 space-y-1 select-none">
        <!-- populated by JS -->
      </div>
    </aside>

    <!-- RIGHT: Calendar -->
    <section class="flex-1 flex flex-col overflow-hidden">
      <!-- Calendar nav bar -->
      <div
        class="bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 px-4 py-2 flex items-center gap-3 shrink-0">
        <!-- Expand text panel button (hidden when expanded) -->
        <button type="button" id="btn-expand-text-panel" onclick="toggleTextPanel()" title="展開活動清單"
          class="nav-btn text-xs text-slate-500 hover:text-teal-600">
          <i class="fa-solid fa-list-ul"></i>
        </button>
        <button onclick="navPrev()" class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
        <h2 id="cal-title" class="text-base font-bold text-slate-800 dark:text-slate-100 min-w-[120px] text-center">
        </h2>
        <button onclick="navNext()" class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
        <button onclick="goToday()"
          class="ml-2 text-xs px-3 py-1 rounded-full border border-teal-500 text-teal-600 dark:text-teal-400 hover:bg-teal-500/10 transition">今天</button>

        <!-- Status bar -->
        <div class="ml-auto flex items-center gap-3 text-xs text-slate-400">
          <span id="sync-status" class="hidden items-center gap-1.5 text-amber-500">
            <i class="fa-solid fa-rotate fa-spin text-xs"></i> 同步中...
          </span>
          <span id="last-sync" class="hidden"></span>
          <!-- Legend -->
          <div class="hidden lg:flex items-center gap-3">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-400"></span>公益</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-indigo-400"></span>課程</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-teal-400"></span>讀書會</span>
          </div>
        </div>
      </div>

      <!-- Calendar grid area -->
      <div id="calendar-container" class="flex-1 overflow-auto">
        <!-- populated by JS based on view mode -->
      </div>
    </section>
  </main>

  <!-- ========== MODALS ========== -->

  <!-- Event Detail Modal -->
  <div id="event-modal" class="modal-overlay hidden" onclick="closeEventModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button onclick="closeEventModal()"
        class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition z-10">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <!-- Type badge -->
      <div class="mb-4">
        <span id="modal-type-badge"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium"></span>
      </div>

      <h2 id="modal-title" class="text-xl font-bold text-slate-900 dark:text-white mb-4 pr-8 leading-snug"></h2>

      <div class="space-y-2.5 mb-6 text-sm">
        <div class="info-row"><i class="fa-regular fa-calendar w-4 text-slate-400"></i><span id="modal-date"></span>
        </div>
        <div class="info-row"><i class="fa-regular fa-clock w-4 text-slate-400"></i><span id="modal-time"></span></div>
        <div id="modal-location-row" class="info-row hidden"><i
            class="fa-solid fa-location-dot w-4 text-slate-400"></i><span id="modal-location"></span></div>
        <div id="modal-host-row" class="info-row hidden"><i
            class="fa-solid fa-person-chalkboard w-4 text-slate-400"></i><span id="modal-host"></span></div>
        <div id="modal-notes-row" class="info-row hidden"><i
            class="fa-regular fa-note-sticky w-4 text-slate-400"></i><span id="modal-notes"
            class="text-slate-500 dark:text-slate-400 text-xs"></span></div>
      </div>

      <!-- Assignee section -->
      <div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-4 mb-5">
        <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-2.5 uppercase tracking-wider">接待負責人</p>
        <div id="modal-assignee" class="flex items-center gap-3">
          <!-- populated by JS -->
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex items-center gap-2 flex-wrap">
        <a id="modal-reg-link" href="#" target="_blank" rel="noopener"
          class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-teal-500 hover:bg-teal-400 text-white text-sm font-medium transition shadow-sm">
          <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i> 前往報名
        </a>
        <button id="btn-claim" onclick="claimEvent()"
          class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-medium transition shadow-sm">
          <i class="fa-solid fa-hand-back-fist text-xs"></i> 我來接待
        </button>
        <button id="btn-unclaim" onclick="unclaimEvent()" style="display:none"
          class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition">
          <i class="fa-solid fa-xmark text-xs"></i> 取消認領
        </button>
        <button id="btn-edit-event" onclick="editCurrentEvent()" style="display:none"
          class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition ml-auto">
          <i class="fa-solid fa-pen text-xs"></i> 編輯
        </button>
        <button id="btn-delete-event" onclick="deleteCurrentEvent()" style="display:none"
          class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-red-300 dark:border-red-800 text-red-500 text-sm hover:bg-red-50 dark:hover:bg-red-900/30 transition">
          <i class="fa-solid fa-trash text-xs"></i> 刪除
        </button>
      </div>
    </div>
  </div>

  <!-- Event Form Modal (Add/Edit) -->
  <div id="form-modal" class="modal-overlay hidden" onclick="closeFormModal(event)">
    <div class="modal-box max-w-lg" onclick="event.stopPropagation()">
      <button onclick="closeFormModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h2 id="form-modal-title" class="text-lg font-bold mb-5 text-slate-900 dark:text-white">新增活動</h2>

      <form id="event-form" onsubmit="submitEventForm(event)" class="space-y-4">
        <input type="hidden" id="form-event-id">

        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="form-label">活動名稱 *</label>
            <input id="form-title" type="text" required class="form-input" placeholder="【活動名稱】">
          </div>
          <div>
            <label class="form-label">類型 *</label>
            <select id="form-type" class="form-input">
              <option value="public">公益活動</option>
              <option value="course">正式課程</option>
              <option value="study_group">讀書會</option>
            </select>
          </div>
          <div>
            <label class="form-label">日期 *</label>
            <input id="form-date" type="date" required class="form-input">
          </div>
          <div>
            <label class="form-label">開始時間 *</label>
            <input id="form-start" type="time" required class="form-input">
          </div>
          <div>
            <label class="form-label">結束時間 *</label>
            <input id="form-end" type="time" required class="form-input">
          </div>
          <div>
            <label class="form-label">地點</label>
            <input id="form-location" type="text" class="form-input" placeholder="台中場 / 地板教室...">
          </div>
          <div>
            <label class="form-label">主持人 / 講師</label>
            <input id="form-host" type="text" class="form-input" placeholder="Amiko...">
          </div>
          <div class="col-span-2">
            <label class="form-label">報名連結</label>
            <input id="form-url" type="url" class="form-input" placeholder="https://bodytalk.tw/s/...">
          </div>
          <div class="col-span-2">
            <label class="form-label">備注</label>
            <textarea id="form-notes" rows="2" class="form-input resize-none" placeholder="補充說明..."></textarea>
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit"
            class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-teal-500 to-emerald-500 text-white font-medium text-sm shadow-md hover:opacity-90 transition">
            <i class="fa-solid fa-floppy-disk mr-1.5"></i> 儲存
          </button>
          <button type="button" onclick="closeFormModal()"
            class="px-5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            取消
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal-overlay hidden" onclick="closeAuthModal(event)">
    <div class="modal-box max-w-sm" onclick="event.stopPropagation()">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <div class="flex items-center gap-3 mb-5">
        <div class="bg-slate-100 dark:bg-slate-800 p-2.5 rounded-xl">
          <i class="fa-brands fa-github text-2xl text-slate-700 dark:text-slate-200"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-slate-900 dark:text-white">GitHub 登入設定</h2>
          <p class="text-xs text-slate-400">輸入 Personal Access Token</p>
        </div>
      </div>

      <div id="auth-logged-in"
        class="hidden mb-5 p-4 bg-teal-50 dark:bg-teal-900/30 rounded-xl border border-teal-200 dark:border-teal-700">
        <div class="flex items-center gap-3">
          <img id="auth-avatar" src="" class="w-10 h-10 rounded-full border-2 border-teal-400" alt="avatar">
          <div>
            <p class="font-semibold text-slate-900 dark:text-white text-sm" id="auth-username"></p>
            <p id="auth-role-badge" class="text-xs"></p>
          </div>
        </div>
      </div>

      <div class="space-y-3 mb-5">
        <div>
          <label class="form-label">GitHub Personal Access Token</label>
          <div class="relative">
            <input id="pat-input" type="password" class="form-input pr-10" placeholder="ghp_xxxxxxxxxxxx">
            <button type="button" onclick="togglePatVisibility()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i id="pat-eye" class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>
        <p class="text-xs text-slate-400 leading-relaxed">
          前往 <a href="https://github.com/settings/tokens/new?scopes=repo&description=bodytalk-calendar" target="_blank"
            class="text-teal-500 underline hover:text-teal-400">GitHub 建立 Token</a>（勾選 <code
            class="bg-slate-100 dark:bg-slate-800 px-1 rounded">repo</code> 權限）
        </p>
      </div>

      <div class="flex gap-3">
        <button onclick="saveAuth()"
          class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-teal-500 to-emerald-500 text-white font-medium text-sm hover:opacity-90 transition">
          <i class="fa-solid fa-check mr-1"></i> 儲存
        </button>
        <button id="btn-logout" onclick="logout()" style="display:none"
          class="px-4 py-2.5 rounded-xl border border-red-300 dark:border-red-700 text-red-500 text-sm hover:bg-red-50 dark:hover:bg-red-900/30 transition">
          登出
        </button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] hidden">
    <div
      class="bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-5 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-2.5 max-w-xs">
      <i id="toast-icon" class="fa-solid fa-circle-check text-teal-400 dark:text-teal-600"></i>
      <span id="toast-msg"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
